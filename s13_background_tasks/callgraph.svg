  <text x="825" y="260" text-anchor="middle" fill="#1f2328" font-size="11">threading.Thread(daemon=True) L132-140</text>
  <rect x="666" y="280" width="318" height="32" rx="8" fill="#fdf0e0" stroke="#b45309"/>
  <text x="825" y="300" text-anchor="middle" fill="#1f2328" font-size="11">_run(task_id) L149</text>

  <rect x="652" y="336" width="346" height="192" rx="12" fill="#fdf0e0" stroke="#b45309"/>
  <text x="825" y="357" text-anchor="middle" fill="#1f2328" font-size="12">ShellExecutor.run L45</text>
  <text x="825" y="378" text-anchor="middle" fill="#6b7280" font-size="10">Popen(start_new_session=True) → 独立进程组</text>
  <text x="825" y="396" text-anchor="middle" fill="#6b7280" font-size="10">communicate(timeout=120)</text>
  <text x="825" y="414" text-anchor="middle" fill="#6b7280" font-size="10">stdout+stderr 合并，截断 50,000 字符</text>
  <text x="825" y="432" text-anchor="middle" fill="#6b7280" font-size="10">Popen 后复查 _closed（L62-65）关竞态窗口</text>
  <text x="825" y="454" text-anchor="middle" fill="#1f2328" font-size="11">finally: _stop_process_group L78-86</text>
  <text x="825" y="472" text-anchor="middle" fill="#6b7280" font-size="10">SIGTERM → sleep(0.05) → SIGKILL</text>
  <text x="825" y="496" text-anchor="middle" fill="#1f2328" font-size="11">format_shell_result(output, exit_code) L19</text>
  <text x="825" y="514" text-anchor="middle" fill="#6b7280" font-size="10">非零退出格式化成显式 Error</text>

  <rect x="652" y="544" width="346" height="82" rx="8" fill="#fdf0e0" stroke="#b45309"/>
  <text x="825" y="565" text-anchor="middle" fill="#1f2328" font-size="12">with self._lock: L162-168</text>
  <text x="825" y="585" text-anchor="middle" fill="#1f2328" font-size="11">task.status / task.result = …</text>
  <text x="825" y="603" text-anchor="middle" fill="#1f2328" font-size="11">_ready.append(task_id)</text>
  <text x="825" y="620" text-anchor="middle" fill="#b45309" font-size="10">★ 到此为止，绝不触碰 messages</text>

  <rect x="652" y="646" width="346" height="112" rx="12" fill="none" stroke="#d0d0d5" stroke-dasharray="5 4"/>
  <text x="668" y="666" fill="#6b7280" font-size="12">三层进程清理</text>
  <text x="668" y="688" fill="#6b7280" font-size="11">① run 的 finally：每次调用后停进程组</text>
  <text x="668" y="710" fill="#6b7280" font-size="11">② AgentHarness.close() L418（code.py finally）</text>
  <text x="668" y="732" fill="#6b7280" font-size="11">③ atexit.register(self.close) L34 兜底</text>
  <text x="668" y="752" fill="#6b7280" font-size="10">close() 里 join(timeout=0.2)：有限等待，不阻塞退出</text>

