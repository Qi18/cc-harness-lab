  <text x="200" y="684" fill="#6b7280" font-size="10">未截断</text>
  <line x1="153" y1="730" x2="153" y2="746" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="278" y1="758" x2="318" y2="734" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="278" y1="778" x2="318" y2="780" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
