  <text x="46" y="1150" fill="#6b7280" font-size="12">Recovery（s11 新增）</text>
  <rect x="216" y="1140" width="12" height="12" rx="3" fill="#d9f2ee" stroke="#0d9488" stroke-width="1.5"/>
  <text x="236" y="1150" fill="#6b7280" font-size="12">Prompt 组装（s10）</text>
  <rect x="396" y="1140" width="12" height="12" rx="3" fill="#efe6fd" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="1150" fill="#6b7280" font-size="12">Memory（s09）</text>
  <rect x="556" y="1140" width="12" height="12" rx="3" fill="#e3edfd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="576" y="1150" fill="#6b7280" font-size="12">Compact（s08）</text>
  <rect x="716" y="1140" width="12" height="12" rx="3" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="736" y="1150" fill="#6b7280" font-size="12">模型 API 调用</text>
