<svg viewBox="0 0 1020 1220" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="1220" fill="#ffffff"/>

  <text x="26" y="30" fill="#1f2328" font-size="15">s11 AgentHarness 调用图 · agent.py L240-372 · 三条独立预算的恢复路径</text>

  <rect x="10" y="48" width="1000" height="128" rx="12" fill="none" stroke="#d0d0d5" stroke-dasharray="5 4"/>
  <text x="26" y="70" fill="#6b7280" font-size="12">⓪ turn 开始（agent.py L246-257）· s10 的 Prompt 组装与 s09 的记忆召回原样保留</text>

  <rect x="28" y="84" width="228" height="42" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="142" y="102" text-anchor="middle" fill="#1f2328" font-size="11">deepcopy(messages[-12:]) L247</text>
  <text x="142" y="117" text-anchor="middle" fill="#6b7280" font-size="10">提取快照</text>

  <rect x="276" y="84" width="228" height="42" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="390" y="102" text-anchor="middle" fill="#1f2328" font-size="11">refresh_system_prompts L248</text>
  <text x="390" y="117" text-anchor="middle" fill="#6b7280" font-size="10">s10 组装链，写 messages[0]</text>

  <rect x="524" y="84" width="228" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="638" y="102" text-anchor="middle" fill="#1f2328" font-size="11">load / inject 记忆 L249-250</text>
  <text x="638" y="117" text-anchor="middle" fill="#6b7280" font-size="10">注入最近 user 消息</text>

  <rect x="772" y="78" width="220" height="54" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="882" y="96" text-anchor="middle" fill="#1f2328" font-size="12">★ RecoveryState(model) L256</text>
  <text x="882" y="112" text-anchor="middle" fill="#6b7280" font-size="10">每 turn 新建 → 预算按 turn 重置</text>
  <text x="882" y="126" text-anchor="middle" fill="#6b7280" font-size="10">max_tokens = 8K  L257</text>

  <rect x="28" y="140" width="964" height="26" rx="6" fill="#fde8e8" stroke="#dc2626"/>
  <text x="510" y="158" text-anchor="middle" fill="#1f2328" font-size="11">state 五字段：current_model ｜ has_escalated ｜ continuation_count ｜ consecutive_529 ｜ has_attempted_reactive_compact</text>

  <line x1="256" y1="105" x2="276" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="504" y1="105" x2="524" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="752" y1="105" x2="772" y2="105" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>

  <rect x="10" y="196" width="1000" height="700" rx="12" fill="none" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="26" y="218" fill="#3b82f6" font-size="12">① while True 循环体（agent.py L259-372）</text>

  <rect x="28" y="232" width="250" height="40" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="153" y="249" text-anchor="middle" fill="#1f2328" font-size="11">todo reminder L260-263</text>
  <text x="153" y="264" text-anchor="middle" fill="#6b7280" font-size="10">3 轮未 todo_write 则注入</text>

  <rect x="28" y="288" width="250" height="40" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="153" y="305" text-anchor="middle" fill="#1f2328" font-size="11">refresh_system_prompts L264</text>
  <text x="153" y="320" text-anchor="middle" fill="#6b7280" font-size="10">每轮刷新，命中缓存则复用</text>

  <rect x="28" y="344" width="250" height="40" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="153" y="361" text-anchor="middle" fill="#1f2328" font-size="11">compactor.prepare L265</text>
  <text x="153" y="376" text-anchor="middle" fill="#6b7280" font-size="10">s08 四层管线</text>

  <rect x="28" y="400" width="250" height="52" rx="8" fill="#fdf3e0" stroke="#f59e0b"/>
  <text x="153" y="419" text-anchor="middle" fill="#1f2328" font-size="11">with_retry(create, state, …) L281</text>
  <text x="153" y="435" text-anchor="middle" fill="#6b7280" font-size="10">model=state.current_model</text>
  <text x="153" y="448" text-anchor="middle" fill="#6b7280" font-size="10">max_tokens 由恢复状态决定</text>

  <rect x="318" y="292" width="290" height="160" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="463" y="312" text-anchor="middle" fill="#1f2328" font-size="12">with_retry  recovery.py L98</text>
  <text x="330" y="334" fill="#1f2328" font-size="11">成功 → consecutive_529 = 0，返回</text>
  <text x="330" y="354" fill="#6b7280" font-size="10">非 429/529 → 立刻 raise（不盲目重试）</text>
  <text x="330" y="374" fill="#6b7280" font-size="10">429 → 退避重试，不累计切换计数</text>
  <text x="330" y="394" fill="#6b7280" font-size="10">529 → consecutive_529++</text>
  <text x="330" y="412" fill="#dc2626" font-size="10">   连续 3 次且有 fallback → 切模型并清零</text>
  <text x="330" y="432" fill="#6b7280" font-size="10">10 次耗尽 → MaxRetriesExceeded</text>
  <text x="330" y="448" fill="#6b7280" font-size="10">（from last_error 保留异常链）</text>

  <rect x="648" y="292" width="344" height="76" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="820" y="312" text-anchor="middle" fill="#1f2328" font-size="11">retry_delay  recovery.py L86</text>
  <text x="660" y="332" fill="#6b7280" font-size="10">Retry-After 存在 → 直接采用（服务端说了算）</text>
  <text x="660" y="350" fill="#6b7280" font-size="10">否则 min(0.5 × 2^attempt, 32s) + random(0, base×25%)</text>
  <text x="660" y="364" fill="#059669" font-size="10">sleep_fn / random_fn 可注入 → 测试零等待</text>

  <rect x="648" y="382" width="344" height="70" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="820" y="402" text-anchor="middle" fill="#1f2328" font-size="11">分类器  recovery.py L37-70</text>
  <text x="660" y="420" fill="#6b7280" font-size="10">error_status_code：status_code 或 response.status_code</text>
  <text x="660" y="438" fill="#6b7280" font-size="10">is_rate_limit / is_overloaded：状态码 ｜ 类名 ｜ 消息文本</text>

  <rect x="28" y="472" width="250" height="52" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="153" y="491" text-anchor="middle" fill="#1f2328" font-size="11">except: is_prompt_too_long? L291</text>
  <text x="153" y="507" text-anchor="middle" fill="#6b7280" font-size="10">首次 → reactive_compact + continue</text>
  <text x="153" y="520" text-anchor="middle" fill="#6b7280" font-size="10">已试过 / 其他异常 → _record_error</text>

  <rect x="318" y="472" width="290" height="52" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="463" y="491" text-anchor="middle" fill="#1f2328" font-size="11">_record_error L233</text>
  <text x="463" y="507" text-anchor="middle" fill="#6b7280" font-size="10">"Error: …" 入 messages 并 return</text>
  <text x="463" y="520" text-anchor="middle" fill="#dc2626" font-size="10">★ 不触发记忆提取</text>

  <rect x="28" y="552" width="580" height="118" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="318" y="574" text-anchor="middle" fill="#1f2328" font-size="12">★ is_output_truncated(finish_reason) L312 —— 在 tool_calls 判断之前</text>
  <text x="44" y="596" fill="#1f2328" font-size="11">第 1 次截断：max_tokens 8K → 64K，has_escalated = True，continue</text>
  <text x="44" y="613" fill="#dc2626" font-size="10">payload 不入列 —— 避免半截 tool_calls 写进协议历史</text>
  <text x="44" y="633" fill="#1f2328" font-size="11">第 2 次起：payload 双写 + 注入 CONTINUATION_PROMPT，最多 3 次</text>
  <text x="44" y="650" fill="#6b7280" font-size="10">续写用尽 → 返回 assistant.content（有内容优先）或错误字符串 L328</text>
  <text x="44" y="665" fill="#6b7280" font-size="10">副作用：截断响应里的工具调用永远不会被执行</text>

  <rect x="648" y="552" width="344" height="118" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="820" y="574" text-anchor="middle" fill="#1f2328" font-size="12">三条路径的预算互不消耗</text>
  <text x="660" y="596" fill="#6b7280" font-size="10">截断：升级 1 次 + 续写 3 次</text>
  <text x="660" y="616" fill="#6b7280" font-size="10">超限：reactive_compact 1 次（布尔，非计数器）</text>
  <text x="660" y="636" fill="#6b7280" font-size="10">瞬态：10 次重试，连续 3 次 529 切备用模型</text>
  <text x="660" y="658" fill="#059669" font-size="10">恢复逻辑自身被约束，不会变成死循环</text>

  <rect x="28" y="690" width="250" height="40" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="153" y="707" text-anchor="middle" fill="#1f2328" font-size="11">assistant 双写 L330-331</text>
  <text x="153" y="722" text-anchor="middle" fill="#6b7280" font-size="10">messages + extraction 快照</text>

  <rect x="28" y="746" width="250" height="40" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="153" y="763" text-anchor="middle" fill="#1f2328" font-size="11">有 tool_calls? L333</text>
  <text x="153" y="778" text-anchor="middle" fill="#6b7280" font-size="10">无 → 进入 ②</text>

  <rect x="318" y="700" width="290" height="44" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="463" y="718" text-anchor="middle" fill="#1f2328" font-size="11">request_manual_compact L352</text>
  <text x="463" y="734" text-anchor="middle" fill="#6b7280" font-size="10">compact 内联特判</text>

  <rect x="318" y="758" width="290" height="44" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="463" y="776" text-anchor="middle" fill="#1f2328" font-size="11">execute_tool → execute_with_handlers</text>
  <text x="463" y="792" text-anchor="middle" fill="#6b7280" font-size="10">L359 / L116 · Pre/PostToolUse 权限</text>

  <rect x="648" y="700" width="344" height="102" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="820" y="720" text-anchor="middle" fill="#1f2328" font-size="11">工具业务错误 ≠ API 故障</text>
  <text x="660" y="740" fill="#6b7280" font-size="10">handler 返回的 "Error: …" 字符串照常作为</text>
  <text x="660" y="758" fill="#6b7280" font-size="10">observation 进入对话，不会被 with_retry 重试</text>
  <text x="660" y="780" fill="#1f2328" font-size="11">spawn_subagent 也走 with_retry  L178</text>
  <text x="660" y="796" fill="#6b7280" font-size="10">子 Agent 用独立 RecoveryState  L169</text>

  <rect x="318" y="816" width="290" height="40" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="463" y="833" text-anchor="middle" fill="#1f2328" font-size="11">tool 结果双写 L362-368</text>
  <text x="463" y="848" text-anchor="middle" fill="#6b7280" font-size="10">沿用原 tool_call_id</text>

  <rect x="28" y="816" width="250" height="40" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="153" y="833" text-anchor="middle" fill="#1f2328" font-size="11">compact_history L369-371</text>
  <text x="153" y="848" text-anchor="middle" fill="#6b7280" font-size="10">批次收尾 · 每 turn 1 次</text>

