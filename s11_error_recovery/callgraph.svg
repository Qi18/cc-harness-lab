  <line x1="18" y1="836" x2="18" y2="252" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="18" y1="252" x2="28" y2="252" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <line x1="608" y1="596" x2="1002" y2="596" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="1002" y1="596" x2="1002" y2="240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="1002" y1="240" x2="10" y2="240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="10" y1="240" x2="26" y2="246" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="700" y="234" fill="#dc2626" font-size="10">升级预算后原样重试（messages 未被污染）</text>

  <rect x="10" y="916" width="1000" height="200" rx="12" fill="none" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="26" y="938" fill="#7c3aed" font-size="12">② turn 结束 · 仅无 tool_calls 且 Stop Hook 放行（L333-343）</text>

  <rect x="28" y="952" width="230" height="44" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="143" y="970" text-anchor="middle" fill="#1f2328" font-size="11">hooks.trigger("Stop") L335</text>
  <text x="143" y="986" text-anchor="middle" fill="#6b7280" font-size="10">要求继续 → 回到 ①</text>

  <rect x="288" y="952" width="240" height="44" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="408" y="970" text-anchor="middle" fill="#1f2328" font-size="11">extract_memories L341</text>
  <text x="408" y="986" text-anchor="middle" fill="#6b7280" font-size="10">输入是快照</text>

  <rect x="558" y="952" width="240" height="44" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="678" y="970" text-anchor="middle" fill="#1f2328" font-size="11">consolidate_memories L342</text>
  <text x="678" y="986" text-anchor="middle" fill="#6b7280" font-size="10">≥10 条合并到 ≤8</text>

  <rect x="828" y="952" width="164" height="44" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="910" y="979" text-anchor="middle" fill="#1f2328" font-size="11">return answer</text>

  <rect x="28" y="1014" width="964" height="86" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="510" y="1036" text-anchor="middle" fill="#1f2328" font-size="12">四个出口对比</text>
  <text x="44" y="1058" fill="#6b7280" font-size="10">正常结束 L343：extract + consolidate → return answer</text>
  <text x="44" y="1076" fill="#dc2626" font-size="10">_record_error L298 / L301：错误入 messages 作 assistant 消息，跳过记忆提取（API 故障不写进长期记忆）</text>
  <text x="44" y="1094" fill="#6b7280" font-size="10">续写用尽 L328：优先返回已产出的 assistant.content，为空才给 "Error: output recovery limit reached"</text>

