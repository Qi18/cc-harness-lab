  <rect x="656" y="676" width="330" height="118" rx="12" fill="none" stroke="#d0d0d5" stroke-dasharray="5 4"/>
  <text x="672" y="696" fill="#6b7280" font-size="12">三层进程清理</text>
  <text x="672" y="718" fill="#6b7280" font-size="11">① run 的 finally：每次调用后停进程组</text>
  <text x="672" y="740" fill="#6b7280" font-size="11">② AgentHarness.close() L340（code.py finally）</text>
  <text x="672" y="762" fill="#6b7280" font-size="11">③ atexit.register(self.close) L34 兜底</text>
  <text x="672" y="784" fill="#6b7280" font-size="10">close() 里 join(timeout=0.2)：有限等待，不阻塞退出</text>

  <rect x="10" y="1026" width="620" height="130" rx="12" fill="none" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="26" y="1046" fill="#7c3aed" font-size="12">③ turn 结束 · 仅无 tool_calls 且 Stop Hook 放行（L298-308）</text>

