  <text x="531" y="1091" text-anchor="middle" fill="#6b7280" font-size="10">→ return answer</text>

  <text x="26" y="1128" fill="#6b7280" font-size="11">后台通知只进 messages（可被模型使用、可被 Compact 压缩归档），永不进 extraction_messages，</text>
  <text x="26" y="1146" fill="#6b7280" font-size="11">因此测试输出与构建日志不会被误提取成长期记忆。</text>

