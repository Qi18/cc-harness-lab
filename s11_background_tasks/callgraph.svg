  <rect x="232" y="1058" width="192" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="328" y="1076" text-anchor="middle" fill="#1f2328" font-size="11">extract_memories L306</text>
  <text x="328" y="1091" text-anchor="middle" fill="#dc2626" font-size="10">快照里没有后台通知</text>

  <rect x="448" y="1058" width="166" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
