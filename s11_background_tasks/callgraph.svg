  <text x="821" y="630" text-anchor="middle" fill="#1f2328" font-size="11">_ready.append(task_id)</text>
  <text x="821" y="648" text-anchor="middle" fill="#dc2626" font-size="10">★ 到此为止，绝不触碰 messages</text>

