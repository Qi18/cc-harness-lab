  <rect x="656" y="352" width="330" height="200" rx="12" fill="#fde8e8" stroke="#dc2626"/>
  <text x="821" y="374" text-anchor="middle" fill="#1f2328" font-size="12">ShellExecutor.run L45</text>
  <text x="821" y="396" text-anchor="middle" fill="#6b7280" font-size="10">Popen(start_new_session=True) → 独立进程组</text>
  <text x="821" y="414" text-anchor="middle" fill="#6b7280" font-size="10">communicate(timeout=120)</text>
  <text x="821" y="432" text-anchor="middle" fill="#6b7280" font-size="10">stdout+stderr 合并，截断 50,000 字符</text>
  <text x="821" y="450" text-anchor="middle" fill="#6b7280" font-size="10">Popen 后复查 _closed（L62-65）</text>
  <text x="821" y="472" text-anchor="middle" fill="#1f2328" font-size="11">finally: _stop_process_group</text>
  <text x="821" y="490" text-anchor="middle" fill="#6b7280" font-size="10">SIGTERM → sleep(0.05) → SIGKILL</text>
  <text x="821" y="516" text-anchor="middle" fill="#1f2328" font-size="11">format_shell_result(output, exit_code)</text>
  <text x="821" y="534" text-anchor="middle" fill="#6b7280" font-size="10">非零退出格式化成显式 Error</text>

