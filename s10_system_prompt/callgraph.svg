<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#98a2b3"/>
    </marker>
    <style>
      .title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #101828; }
      .subtitle { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #667085; }
      .legend { font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475467; }
      .box-title { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #101828; }
      .box-text { font: 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475467; }
      .edge-label { font: 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #667085; }
      .edge { stroke: #667085; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .link { stroke: #98a2b3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-light); }
      .stage { fill: #f9fafb; stroke: #98a2b3; }
      .decision { fill: #ffffff; stroke: #667085; }
      .prompt { fill: #ecfdf3; stroke: #32d583; }
      .memory { fill: #f4f3ff; stroke: #9b8afb; }
      .compact { fill: #eff8ff; stroke: #53b1fd; }
      .model { fill: #fff4e5; stroke: #f79009; }
    </style>
  </defs>

  <rect width="1280" height="960" fill="#ffffff"/>
  <text x="32" y="38" class="title">s10 一个 user turn 的调用图</text>
  <text x="32" y="60" class="subtitle">左列是父 Agent 的四个阶段，右列是被调用的子系统；未标模块名的行号属于 agent_loop.py。</text>

  <rect x="32" y="76" width="14" height="14" rx="3" class="prompt"/>
  <text x="52" y="88" class="legend">Prompt 组装（s10 新增）</text>
  <rect x="212" y="76" width="14" height="14" rx="3" class="memory"/>
  <text x="232" y="88" class="legend">Memory（s09）</text>
  <rect x="342" y="76" width="14" height="14" rx="3" class="compact"/>
  <text x="362" y="88" class="legend">Compact（s08）</text>
  <rect x="472" y="76" width="14" height="14" rx="3" class="model"/>
  <text x="492" y="88" class="legend">模型 API 调用</text>
  <rect x="602" y="76" width="14" height="14" rx="3" class="stage"/>
  <text x="622" y="88" class="legend">循环阶段 / 工具与 Hook</text>

  <rect x="90" y="126" width="620" height="84" rx="10" class="stage"/>
  <text x="110" y="152" class="box-title">⓪ 装配 · code.py → AgentHarness.__init__</text>
  <text x="110" y="176" class="box-text">SkillLoader · TodoManager · BuiltinTools · HookManager · ToolExecutor</text>
  <text x="110" y="196" class="box-text">CompactToolController · ContextCompactor · memory.configure · 父子 assembler (L80)</text>

  <rect x="90" y="240" width="620" height="104" rx="10" class="stage"/>
  <text x="110" y="266" class="box-title">① turn 开始 · 每 turn 一次</text>
  <text x="110" y="290" class="box-text">latest_user_request (L172) · extraction_messages 快照 (L176)</text>
  <text x="110" y="310" class="box-text">refresh_system_prompts(messages) (L179)</text>
  <text x="110" y="330" class="box-text">memory.load_memories (L180) → inject_recalled_memories (L181)</text>

  <rect x="90" y="374" width="620" height="124" rx="10" class="stage"/>
  <text x="110" y="400" class="box-title">② 每轮模型调用前</text>
  <text x="110" y="424" class="box-text">rounds_since_todo ≥ 3 → reminder (L195)</text>
  <text x="110" y="444" class="box-text">refresh_system_prompts (L205) → compactor.prepare (L206) → 过滤 compact (L209)</text>
  <rect x="104" y="452" width="592" height="24" rx="6" class="model"/>
  <text x="110" y="469" class="box-text">completion_request → client.chat.completions.create (L219)</text>
  <text x="110" y="492" class="box-text">上下文溢出 → reactive_compact，最多重试 1 次 (L225-L233)</text>

  <rect x="290" y="528" width="220" height="38" rx="10" class="decision"/>
  <text x="400" y="552" text-anchor="middle" class="box-text">assistant.tool_calls ?</text>

  <rect x="90" y="596" width="620" height="132" rx="10" class="stage"/>
  <text x="110" y="622" class="box-title">③ 工具批次 (L267)</text>
  <text x="110" y="646" class="box-text">compact → CompactToolController.request (L270)</text>
  <text x="110" y="666" class="box-text">其他工具 → ToolExecutor.execute (L278)</text>
  <text x="110" y="686" class="box-text">每个 tool_call 追加 role=tool，并同步写入提取快照 (L282-L288)</text>
  <text x="110" y="706" class="box-text">整批结果写完后才执行 compact_history (L289-L292)</text>

  <rect x="90" y="758" width="620" height="112" rx="10" class="stage"/>
  <text x="110" y="784" class="box-title">④ turn 结束 · 仅最终回答</text>
  <text x="110" y="808" class="box-text">Stop Hook (L247)：要求继续则追加 user 消息并回到 ②</text>
  <text x="110" y="828" class="box-text">memory.extract_memories(快照) (L255) → consolidate_memories (L256)</text>
  <text x="110" y="848" class="box-text">return answer (L257)</text>

  <line x1="400" y1="210" x2="400" y2="238" class="edge"/>
  <line x1="400" y1="344" x2="400" y2="372" class="edge"/>
  <line x1="400" y1="498" x2="400" y2="526" class="edge"/>
  <line x1="400" y1="566" x2="400" y2="594" class="edge"/>
  <text x="408" y="586" class="edge-label">有</text>

  <path d="M510 547 L728 547 L728 814 L713 814" class="edge"/>
  <text x="516" y="540" class="edge-label">无 tool_calls</text>

  <path d="M90 690 L62 690 L62 436 L86 436" class="edge"/>
  <text x="16" y="566" class="edge-label">下一轮</text>

  <rect x="800" y="126" width="450" height="170" rx="10" class="prompt"/>
  <text x="820" y="152" class="box-title">system_prompt.py · Prompt 组装</text>
  <text x="820" y="176" class="box-text">_prompt_context(tools)：enabled_tools / workspace /</text>
  <text x="820" y="196" class="box-text">skill_catalog / memory_catalog（agent_loop L98）</text>
  <text x="820" y="220" class="box-text">get() L88 → context_key(sort_keys JSON) L45</text>
  <text x="820" y="240" class="box-text">命中 → cache_hits；未命中 → assemble() L55</text>
  <text x="820" y="264" class="box-text">sections：identity · guidance · tools · workspace</text>
  <text x="820" y="284" class="box-text">（+ skills / + memory，仅在目录非空时出现）</text>

  <rect x="800" y="320" width="450" height="150" rx="10" class="memory"/>
  <text x="820" y="346" class="box-title">memory.py · Memory 子系统</text>
  <text x="820" y="370" class="box-text">load_memories L303 → select_relevant_memories L268</text>
  <text x="820" y="390" class="box-text">失败降级 keyword_memory_selection L249</text>
  <text x="820" y="410" class="box-text">inject_recalled_memories L332（&lt;relevant-memories&gt;）</text>
  <text x="820" y="430" class="box-text">extract_memories L425 → write_memory_file L93</text>
  <text x="820" y="450" class="box-text">consolidate_memories L476（≥10 条整理到 ≤8 条）</text>

  <rect x="800" y="494" width="450" height="150" rx="10" class="compact"/>
  <text x="820" y="520" class="box-title">context_compact.py · Compact 子系统</text>
  <text x="820" y="544" class="box-text">prepare L315：L3 落盘 → L1 裁剪 → L2 占位 → L4 摘要</text>
  <text x="820" y="564" class="box-text">compact_history L274：transcript + 摘要替换全历史</text>
  <text x="820" y="584" class="box-text">reactive_compact L288：保留尾部 5 条消息</text>
  <text x="820" y="604" class="box-text">CompactToolController.request L379：每 turn 只允许一次</text>
  <text x="820" y="628" class="box-text">system_prefix L71 保证首条 System Prompt 不被丢弃</text>

  <rect x="800" y="668" width="450" height="130" rx="10" class="stage"/>
  <text x="820" y="694" class="box-title">tool_use.py / hooks.py / permission.py</text>
  <text x="820" y="718" class="box-text">ToolExecutor.execute L146：JSON 解析 → ToolRequest</text>
  <text x="820" y="738" class="box-text">PreToolUse：PermissionPolicy.check → log_hook</text>
  <text x="820" y="758" class="box-text">handler：BuiltinTools / TodoManager / SubagentRunner</text>
  <text x="820" y="778" class="box-text">PostToolUse：output_hook（&gt;10k 字符额外提示）</text>

  <rect x="800" y="822" width="450" height="108" rx="10" class="stage"/>
  <text x="820" y="848" class="box-title">subagent.py · SubAgent</text>
  <text x="820" y="872" class="box-text">prompt_supplier() → refresh_system_prompts L134</text>
  <text x="820" y="892" class="box-text">fresh messages=[system, user] · SUB_TOOLS（6 个）</text>
  <text x="820" y="912" class="box-text">共享 ToolExecutor 与 Hooks；上限 30 轮</text>

  <path d="M710 168 L796 172" class="link"/>
  <path d="M710 300 L796 214" class="link"/>
  <path d="M710 430 L796 250" class="link"/>
  <path d="M710 322 L796 356" class="link"/>
  <path d="M710 470 L796 542" class="link"/>
  <path d="M710 690 L796 716" class="link"/>
  <path d="M710 800 L796 440" class="link"/>
</svg>
