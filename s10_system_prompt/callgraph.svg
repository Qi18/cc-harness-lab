  <line x1="536" y1="174" x2="574" y2="174" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrP)"/>
  <line x1="764" y1="168" x2="794" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="764" y1="180" x2="794" y2="190" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrP)"/>
  <line x1="884" y1="204" x2="884" y2="216" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrP)"/>
  <line x1="248" y1="200" x2="286" y2="180" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <rect x="10" y="296" width="980" height="150" rx="12" fill="none" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="26" y="318" fill="#7c3aed" font-size="12">① turn 开始（agent.py L211-221）</text>

  <rect x="28" y="332" width="230" height="44" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="143" y="350" text-anchor="middle" fill="#1f2328" font-size="11">latest_user_request L211</text>
  <text x="143" y="366" text-anchor="middle" fill="#6b7280" font-size="10">active_request 兜底</text>

  <rect x="288" y="332" width="230" height="44" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="403" y="350" text-anchor="middle" fill="#1f2328" font-size="11">deepcopy(messages[-12:]) L212</text>
  <text x="403" y="366" text-anchor="middle" fill="#6b7280" font-size="10">提取快照，与 Compact 解耦</text>

  <rect x="548" y="332" width="230" height="44" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="663" y="350" text-anchor="middle" fill="#1f2328" font-size="11">refresh_system_prompts L213</text>
  <text x="663" y="366" text-anchor="middle" fill="#6b7280" font-size="10">写入 messages[0]</text>

  <rect x="288" y="392" width="490" height="40" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="533" y="410" text-anchor="middle" fill="#1f2328" font-size="11">memory.load_memories L214 → inject_recalled_memories L215</text>
  <text x="533" y="426" text-anchor="middle" fill="#6b7280" font-size="10">side-query 选 ≤5 条，注入最近 user 消息（不碰 system）</text>

