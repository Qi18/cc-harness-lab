  <text x="26" y="30" fill="#1f2328" font-size="15">s10 AgentHarness 调用图 · agent.py L205-305 · System Prompt 由运行时状态组装</text>

  <rect x="10" y="48" width="980" height="228" rx="12" fill="none" stroke="#0d9488" stroke-dasharray="5 4"/>
  <text x="26" y="70" fill="#0d9488" font-size="12">★ Prompt 组装链 · refresh_system_prompts（agent.py L79）· 四个调用点共用</text>

  <rect x="28" y="84" width="220" height="44" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="138" y="102" text-anchor="middle" fill="#1f2328" font-size="11">skills.registry = skills.scan()</text>
  <text x="138" y="118" text-anchor="middle" fill="#6b7280" font-size="10">每轮重扫磁盘 → Skill 热发现</text>

  <rect x="286" y="84" width="250" height="44" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="411" y="102" text-anchor="middle" fill="#1f2328" font-size="11">_prompt_context(tools) L69</text>
  <text x="411" y="118" text-anchor="middle" fill="#6b7280" font-size="10">四项运行时事实打包成 dict</text>

  <rect x="574" y="70" width="400" height="72" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="774" y="88" text-anchor="middle" fill="#1f2328" font-size="11">enabled_tools = registered_tool_names(tools)  ← 注册表派生</text>
  <text x="774" y="105" text-anchor="middle" fill="#1f2328" font-size="11">workspace = settings.workdir</text>
  <text x="774" y="122" text-anchor="middle" fill="#1f2328" font-size="11">skill_catalog = skills.catalog() if registry else ""</text>
  <text x="774" y="136" text-anchor="middle" fill="#7c3aed" font-size="11">memory_catalog = memory.read_memory_index()</text>

  <rect x="286" y="152" width="250" height="44" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="411" y="170" text-anchor="middle" fill="#1f2328" font-size="11">SystemPromptAssembler.get L84</text>
  <text x="411" y="186" text-anchor="middle" fill="#6b7280" font-size="10">父/子两个独立实例，各自缓存</text>

  <rect x="574" y="152" width="190" height="44" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="669" y="170" text-anchor="middle" fill="#1f2328" font-size="11">context_key L44</text>
  <text x="669" y="186" text-anchor="middle" fill="#6b7280" font-size="10">确定性 JSON，非 hash()</text>

  <rect x="794" y="146" width="180" height="26" rx="6" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="884" y="164" text-anchor="middle" fill="#1f2328" font-size="11">key 相同 → cache_hits++</text>

  <rect x="794" y="178" width="180" height="26" rx="6" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="884" y="196" text-anchor="middle" fill="#1f2328" font-size="11">key 变化 → assemble()</text>

  <rect x="286" y="216" width="688" height="48" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="630" y="234" text-anchor="middle" fill="#1f2328" font-size="11">assemble L53 → identity · guidance · tools · workspace ｜ skills（有 Skill 时）｜ memory（有索引时）</text>
  <text x="630" y="252" text-anchor="middle" fill="#6b7280" font-size="10">last_sections 记录本次生效的 section 名 → 可断言的可观测量</text>

  <rect x="28" y="152" width="220" height="112" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="138" y="172" text-anchor="middle" fill="#1f2328" font-size="11">四个调用点</text>
  <text x="40" y="192" fill="#6b7280" font-size="10">① __init__ 末尾  L67（不传 messages）</text>
  <text x="40" y="210" fill="#6b7280" font-size="10">② agent_loop 开头  L213</text>
  <text x="40" y="228" fill="#6b7280" font-size="10">③ 每轮循环内  L228</text>
  <text x="40" y="246" fill="#6b7280" font-size="10">④ spawn_subagent  L144（子 Prompt）</text>
  <text x="40" y="260" fill="#0d9488" font-size="10">传 messages 时就地改写 messages[0]</text>

  <line x1="248" y1="106" x2="286" y2="106" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrP)"/>
  <line x1="536" y1="106" x2="574" y2="106" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrP)"/>
