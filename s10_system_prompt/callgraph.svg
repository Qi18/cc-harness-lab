  <rect x="10" y="466" width="980" height="470" rx="12" fill="none" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="26" y="488" fill="#3b82f6" font-size="12">② while True 循环体（agent.py L223-305）</text>

  <rect x="28" y="502" width="250" height="42" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="153" y="520" text-anchor="middle" fill="#1f2328" font-size="11">todo reminder 检查 L224-227</text>
  <text x="153" y="535" text-anchor="middle" fill="#6b7280" font-size="10">3 轮未 todo_write 则注入</text>

  <rect x="28" y="562" width="250" height="46" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="153" y="580" text-anchor="middle" fill="#1f2328" font-size="12">★ refresh_system_prompts L228</text>
  <text x="153" y="597" text-anchor="middle" fill="#6b7280" font-size="10">每轮刷新：Skill/Memory 变化即时生效</text>

  <rect x="318" y="562" width="250" height="46" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="443" y="580" text-anchor="middle" fill="#1f2328" font-size="11">compactor.prepare L229</text>
  <text x="443" y="597" text-anchor="middle" fill="#6b7280" font-size="10">L3 → L1 → L2 → L4；system 前缀不动</text>

  <rect x="28" y="626" width="250" height="46" rx="8" fill="#fdf3e0" stroke="#f59e0b"/>
  <text x="153" y="644" text-anchor="middle" fill="#1f2328" font-size="11">chat.completions.create L245</text>
  <text x="153" y="661" text-anchor="middle" fill="#6b7280" font-size="10">tools=PARENT_TOOLS（已压缩则摘除 compact）</text>

  <rect x="318" y="626" width="250" height="46" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="443" y="644" text-anchor="middle" fill="#1f2328" font-size="11">is_prompt_too_long_error L249</text>
  <text x="443" y="661" text-anchor="middle" fill="#6b7280" font-size="10">→ reactive_compact，最多 1 次</text>

  <rect x="28" y="690" width="250" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="153" y="708" text-anchor="middle" fill="#1f2328" font-size="11">assistant 双写 L264-265</text>
  <text x="153" y="723" text-anchor="middle" fill="#6b7280" font-size="10">messages + extraction 快照</text>

  <rect x="28" y="750" width="250" height="42" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="153" y="768" text-anchor="middle" fill="#1f2328" font-size="11">有 tool_calls? L267</text>
  <text x="153" y="783" text-anchor="middle" fill="#6b7280" font-size="10">无 → 进入 ③</text>

  <rect x="318" y="700" width="250" height="46" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="443" y="718" text-anchor="middle" fill="#1f2328" font-size="11">request_manual_compact L286</text>
  <text x="443" y="735" text-anchor="middle" fill="#6b7280" font-size="10">compact 内联特判 · 审批阶段</text>

  <rect x="318" y="762" width="250" height="46" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="443" y="780" text-anchor="middle" fill="#1f2328" font-size="11">execute_tool L293</text>
  <text x="443" y="797" text-anchor="middle" fill="#6b7280" font-size="10">其余 8 个工具</text>

  <rect x="608" y="700" width="366" height="108" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="791" y="720" text-anchor="middle" fill="#1f2328" font-size="11">execute_with_handlers L97</text>
  <text x="791" y="738" text-anchor="middle" fill="#6b7280" font-size="10">PreToolUse 权限 → handler → PostToolUse</text>
  <text x="791" y="756" text-anchor="middle" fill="#6b7280" font-size="10">父：bash / read / write / edit / glob / todo_write / task</text>
  <text x="791" y="774" text-anchor="middle" fill="#6b7280" font-size="10">子：五个基础工具 + load_skill（无 todo/task/compact）</text>
  <text x="791" y="794" text-anchor="middle" fill="#0d9488" font-size="10">→ 与 tools section 声明的清单严格一致</text>

  <rect x="318" y="828" width="250" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="443" y="846" text-anchor="middle" fill="#1f2328" font-size="11">tool 结果双写 L296-302</text>
  <text x="443" y="861" text-anchor="middle" fill="#6b7280" font-size="10">沿用原 tool_call_id</text>

  <rect x="28" y="828" width="250" height="42" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="153" y="846" text-anchor="middle" fill="#1f2328" font-size="11">compact_history L303-305</text>
  <text x="153" y="861" text-anchor="middle" fill="#6b7280" font-size="10">批次收尾 · 每 turn 1 次</text>

  <rect x="608" y="562" width="366" height="110" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="791" y="582" text-anchor="middle" fill="#1f2328" font-size="12">为什么每轮都刷 Prompt</text>
  <text x="622" y="604" fill="#6b7280" font-size="10">模型可能在本 turn 内 write_file 建出新的 SKILL.md，</text>
  <text x="622" y="622" fill="#6b7280" font-size="10">或触发记忆写入改变 MEMORY.md —— 下一轮就该看到。</text>
  <text x="622" y="644" fill="#6b7280" font-size="10">状态没变时 context key 相同 → 命中缓存，仅省字符串拼接；</text>
  <text x="622" y="662" fill="#0d9488" font-size="10">skills.scan() 在缓存上游，磁盘遍历每轮仍会发生。</text>

