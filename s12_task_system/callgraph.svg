  <rect x="0" y="0" width="1010" height="1160" fill="#ffffff"/>

  <text x="26" y="30" fill="#1f2328" font-size="15">s12 AgentHarness 调用图 · agent.py L249-380 · 四层能力叠加，Task 只是新注册的 handler</text>

  <rect x="10" y="48" width="990" height="150" rx="12" fill="none" stroke="#d0d0d5" stroke-dasharray="5 4"/>
  <text x="26" y="70" fill="#6b7280" font-size="12">⓪ 组装期 · AgentHarness.__init__ · 权限隔离在此固化</text>

  <rect x="28" y="84" width="220" height="42" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="138" y="102" text-anchor="middle" fill="#1f2328" font-size="11">Settings.from_env</text>
  <text x="138" y="117" text-anchor="middle" fill="#6b7280" font-size="10">CC_TASKS_DIR → tasks_dir</text>

  <rect x="268" y="84" width="280" height="42" rx="8" fill="#e6f4ef" stroke="#059669"/>
  <text x="408" y="102" text-anchor="middle" fill="#1f2328" font-size="11">TaskStore(tasks_dir, workdir) L63</text>
  <text x="408" y="117" text-anchor="middle" fill="#6b7280" font-size="10">TaskManager(store) L64 · 路径边界随参数传入</text>

  <rect x="568" y="84" width="200" height="42" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="668" y="102" text-anchor="middle" fill="#1f2328" font-size="11">两个 SystemPromptAssembler</text>
  <text x="668" y="117" text-anchor="middle" fill="#6b7280" font-size="10">父 / 子各一，s10</text>

  <rect x="788" y="84" width="200" height="42" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="888" y="102" text-anchor="middle" fill="#1f2328" font-size="11">sleep_fn / random_fn</text>
  <text x="888" y="117" text-anchor="middle" fill="#6b7280" font-size="10">可注入，s11</text>

  <rect x="28" y="140" width="960" height="48" rx="8" fill="#e6f4ef" stroke="#059669"/>
  <text x="508" y="159" text-anchor="middle" fill="#1f2328" font-size="11">parent_handlers L75-86：基础 5 + todo_write + task + create/update/list/get/claim/complete_task　｜　sub_handlers：仅基础 5 + load_skill</text>
  <text x="508" y="178" text-anchor="middle" fill="#059669" font-size="10">六个任务工具仅父 Agent；子 Agent 的 tools section 由 SUB_TOOLS 派生，Prompt 里根本不会提到它们</text>

  <line x1="248" y1="105" x2="268" y2="105" stroke="#059669" stroke-width="1.5" marker-end="url(#arrT)"/>
  <line x1="548" y1="105" x2="568" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="768" y1="105" x2="788" y2="105" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="10" y="218" width="990" height="106" rx="12" fill="none" stroke="#7c3aed" stroke-dasharray="5 4"/>
  <text x="26" y="240" fill="#7c3aed" font-size="12">① turn 开始（agent.py L253-265）</text>

  <rect x="28" y="254" width="230" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="143" y="272" text-anchor="middle" fill="#1f2328" font-size="11">deepcopy(messages[-12:])</text>
  <text x="143" y="287" text-anchor="middle" fill="#6b7280" font-size="10">提取快照</text>

  <rect x="278" y="254" width="250" height="42" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="403" y="272" text-anchor="middle" fill="#1f2328" font-size="11">refresh_system_prompts L257</text>
  <text x="403" y="287" text-anchor="middle" fill="#059669" font-size="10">tools section 自动含 6 个任务工具</text>

  <rect x="548" y="254" width="230" height="42" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="663" y="272" text-anchor="middle" fill="#1f2328" font-size="11">load / inject 记忆</text>
  <text x="663" y="287" text-anchor="middle" fill="#6b7280" font-size="10">注入最近 user 消息</text>

  <rect x="798" y="254" width="190" height="42" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="893" y="272" text-anchor="middle" fill="#1f2328" font-size="11">RecoveryState L265</text>
  <text x="893" y="287" text-anchor="middle" fill="#6b7280" font-size="10">预算按 turn 重置</text>

  <line x1="258" y1="275" x2="278" y2="275" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="528" y1="275" x2="548" y2="275" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="778" y1="275" x2="798" y2="275" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="10" y="344" width="990" height="590" rx="12" fill="none" stroke="#3b82f6" stroke-dasharray="5 4"/>
  <text x="26" y="366" fill="#3b82f6" font-size="12">② while True 循环体（agent.py L267-380）</text>

  <rect x="28" y="380" width="240" height="40" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="148" y="397" text-anchor="middle" fill="#1f2328" font-size="11">todo reminder 检查</text>
  <text x="148" y="412" text-anchor="middle" fill="#6b7280" font-size="10">3 轮未 todo_write 则注入</text>

  <rect x="28" y="436" width="240" height="40" rx="8" fill="#d9f2ee" stroke="#0d9488"/>
  <text x="148" y="453" text-anchor="middle" fill="#1f2328" font-size="11">refresh_system_prompts L273</text>
  <text x="148" y="468" text-anchor="middle" fill="#6b7280" font-size="10">每轮刷新，命中缓存则复用</text>

  <rect x="28" y="492" width="240" height="40" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="148" y="509" text-anchor="middle" fill="#1f2328" font-size="11">compactor.prepare</text>
  <text x="148" y="524" text-anchor="middle" fill="#6b7280" font-size="10">s08 四层管线</text>

  <rect x="28" y="548" width="240" height="46" rx="8" fill="#fdf3e0" stroke="#f59e0b"/>
  <text x="148" y="566" text-anchor="middle" fill="#1f2328" font-size="11">with_retry(create, …) L290</text>
  <text x="148" y="583" text-anchor="middle" fill="#6b7280" font-size="10">仅 429/529 重试；其余立刻上抛</text>

  <rect x="308" y="492" width="270" height="102" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="443" y="512" text-anchor="middle" fill="#1f2328" font-size="11">s11 三条恢复路径（预算独立）</text>
  <text x="320" y="532" fill="#6b7280" font-size="10">截断 L321：首次 8K→64K 且 payload 不入列</text>
  <text x="320" y="550" fill="#6b7280" font-size="10">超限 L307：reactive_compact 一次</text>
  <text x="320" y="568" fill="#6b7280" font-size="10">429/529：退避 + 抖动，连续 3 次切模型</text>
  <text x="320" y="587" fill="#dc2626" font-size="10">恢复发生在调用层 → 不会重复执行 create_task</text>

  <rect x="618" y="492" width="370" height="102" rx="8" fill="#e6f4ef" stroke="#059669"/>
  <text x="803" y="512" text-anchor="middle" fill="#1f2328" font-size="12">本章新增能力为什么只要 11 行接入</text>
  <text x="630" y="534" fill="#6b7280" font-size="10">tools.py 追加 *TASK_TOOLS → s10 的 tools section 自动更新</text>
  <text x="630" y="552" fill="#6b7280" font-size="10">handler 表追加 6 项 → 统一入口自动获得权限与 Hook</text>
  <text x="630" y="570" fill="#6b7280" font-size="10">agent_loop 内零特判（只有 compact 需要内联）</text>
  <text x="630" y="588" fill="#059669" font-size="10">新能力只需注册，不需要到处打补丁</text>

  <rect x="28" y="614" width="240" height="40" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="148" y="631" text-anchor="middle" fill="#1f2328" font-size="11">assistant 双写 L340</text>
  <text x="148" y="646" text-anchor="middle" fill="#6b7280" font-size="10">messages + extraction 快照</text>

  <rect x="28" y="674" width="240" height="40" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="148" y="691" text-anchor="middle" fill="#1f2328" font-size="11">有 tool_calls?</text>
  <text x="148" y="706" text-anchor="middle" fill="#6b7280" font-size="10">无 → 进入 ③</text>

  <rect x="308" y="674" width="270" height="46" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="443" y="692" text-anchor="middle" fill="#1f2328" font-size="11">execute_tool L160 → execute_with_handlers</text>
  <text x="443" y="709" text-anchor="middle" fill="#6b7280" font-size="10">PreToolUse 权限 → handler → PostToolUse</text>

  <rect x="618" y="632" width="370" height="132" rx="8" fill="#e6f4ef" stroke="#059669"/>
  <text x="803" y="652" text-anchor="middle" fill="#1f2328" font-size="12">TaskManager.run_* → TaskStore（tasks.py）</text>
  <text x="630" y="674" fill="#6b7280" font-size="10">run_create L276 → create L93：open("x") 排他 + 冲突重摇 ID</text>
  <text x="630" y="692" fill="#6b7280" font-size="10">run_update L284 → update_dependencies L168</text>
  <text x="630" y="708" fill="#059669" font-size="10">　　全批校验 · 去重 · 自依赖 · _depends_on 传递环检测</text>
  <text x="630" y="726" fill="#6b7280" font-size="10">run_claim / run_complete → 状态机 L224 / L238 + 解锁差集</text>
  <text x="630" y="744" fill="#6b7280" font-size="10">save L118：同目录临时文件 + os.replace 原子替换</text>
  <text x="630" y="760" fill="#6b7280" font-size="10">_observe L269：存储异常 → "Error: …" 观察，不击穿 Loop</text>

  <rect x="308" y="736" width="270" height="40" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="443" y="753" text-anchor="middle" fill="#1f2328" font-size="11">tool 结果双写 L371-377</text>
  <text x="443" y="768" text-anchor="middle" fill="#6b7280" font-size="10">沿用原 tool_call_id</text>

  <rect x="28" y="736" width="240" height="40" rx="8" fill="#e3edfd" stroke="#3b82f6"/>
  <text x="148" y="753" text-anchor="middle" fill="#1f2328" font-size="11">compact_history L379</text>
  <text x="148" y="768" text-anchor="middle" fill="#6b7280" font-size="10">批次收尾 · 每 turn 1 次</text>

  <rect x="308" y="796" width="680" height="122" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
  <text x="648" y="816" text-anchor="middle" fill="#1f2328" font-size="12">.tasks/task_&lt;8 hex&gt;.json 的四道边界（每次读写都过）</text>
  <text x="322" y="838" fill="#6b7280" font-size="10">① _root L36：tasks_dir resolve 后必须在 workdir 内</text>
  <text x="322" y="856" fill="#6b7280" font-size="10">② _path L46：fullmatch ^task_[0-9a-f]{8}$，拼接后再验 relative_to</text>
  <text x="322" y="874" fill="#6b7280" font-size="10">③ load L137：set(data) 必须严格等于六字段集合，多一个也拒</text>
  <text x="322" y="892" fill="#6b7280" font-size="10">④ _validate_record L66：状态白名单 · owner 类型 · blockedBy 无重复无自依赖</text>
  <text x="322" y="910" fill="#059669" font-size="10">依赖文件缺失或损坏 → incomplete_dependencies L211 计为未完成，任务保持阻塞（保守）</text>

  <rect x="28" y="796" width="240" height="60" rx="8" fill="#e6f4ef" stroke="#059669"/>
  <text x="148" y="816" text-anchor="middle" fill="#1f2328" font-size="11">两阶段建图</text>
  <text x="148" y="834" text-anchor="middle" fill="#6b7280" font-size="10">第 1 轮 create_task × N</text>
  <text x="148" y="850" text-anchor="middle" fill="#6b7280" font-size="10">第 2 轮 update_task(真实 ID)</text>

