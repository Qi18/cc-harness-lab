<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#98a2b3"/>
    </marker>
    <marker id="arrow-task" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7f56d9"/>
    </marker>
    <style>
      .title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #101828; }
      .subtitle { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #667085; }
      .legend { font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475467; }
      .box-title { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #101828; }
      .box-text { font: 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475467; }
      .edge-label { font: 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #667085; }
      .edge { stroke: #667085; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-plain { stroke: #667085; stroke-width: 1.5; fill: none; }
      .link { stroke: #98a2b3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-light); }
      .dependency { stroke: #7f56d9; stroke-width: 1.4; fill: none; marker-end: url(#arrow-task); }
      .stage { fill: #f9fafb; stroke: #98a2b3; }
      .decision { fill: #ffffff; stroke: #667085; }
      .task { fill: #f9f5ff; stroke: #7f56d9; }
      .recovery { fill: #fef3f2; stroke: #f97066; }
      .prompt { fill: #ecfdf3; stroke: #32d583; }
      .memory { fill: #fff6ed; stroke: #f79009; }
      .compact { fill: #eff8ff; stroke: #53b1fd; }
    </style>
  </defs>

  <rect width="1280" height="1440" fill="#ffffff"/>
  <text x="32" y="38" class="title">s12 一个 user turn 的调用图 · 持久任务板</text>
  <text x="32" y="60" class="subtitle">左列是父 Agent 的六个阶段，紫底为 s12 新增的任务板路径；右列是被调用的子系统；未标模块名的行号属于 agent_loop.py。</text>

  <rect x="32" y="76" width="14" height="14" rx="3" class="task"/>
  <text x="52" y="88" class="legend">Task System（s12 新增）</text>
  <rect x="210" y="76" width="14" height="14" rx="3" class="recovery"/>
  <text x="230" y="88" class="legend">恢复分支（s11）</text>
  <rect x="340" y="76" width="14" height="14" rx="3" class="prompt"/>
  <text x="360" y="88" class="legend">Prompt 组装（s10）</text>
  <rect x="490" y="76" width="14" height="14" rx="3" class="memory"/>
  <text x="510" y="88" class="legend">Memory（s09）</text>
  <rect x="610" y="76" width="14" height="14" rx="3" class="compact"/>
  <text x="630" y="88" class="legend">Compact（s08）</text>
  <rect x="740" y="76" width="14" height="14" rx="3" class="stage"/>
  <text x="760" y="88" class="legend">循环阶段 / 工具与 Hook</text>

  <rect x="90" y="126" width="620" height="134" rx="10" class="stage"/>
  <text x="110" y="152" class="box-title">⓪ 装配 · code.py → AgentHarness.__init__</text>
  <text x="110" y="176" class="box-text">SkillLoader · TodoManager · BuiltinTools · HookManager · ToolExecutor (L73-L84)</text>
  <text x="110" y="196" class="box-text">CompactToolController · ContextCompactor · memory.configure · 父子 assembler (L98)</text>
  <rect x="104" y="204" width="592" height="46" rx="6" class="task"/>
  <text x="110" y="222" class="box-text">assert_inside_workdir(settings.tasks_dir) (L75-L77) → TaskManager(tasks_dir) (L78)</text>
  <text x="110" y="242" class="box-text">**self.tasks.handlers() 只并入 _parent_handlers (L121)，子表拿不到任务工具</text>

  <rect x="90" y="284" width="620" height="110" rx="10" class="stage"/>
  <text x="110" y="310" class="box-title">① turn 开始 · 每 turn 一次</text>
  <text x="110" y="334" class="box-text">latest_user_request (L251) · extraction_messages 快照 (L255)</text>
  <text x="110" y="354" class="box-text">refresh_system_prompts (L258) → load_memories → inject (L259-L260)</text>
  <text x="110" y="374" class="box-text">RecoveryState(settings.model) (L269)：恢复额度归零；任务板不在这里加载</text>

  <rect x="90" y="422" width="620" height="164" rx="10" class="stage"/>
  <text x="110" y="448" class="box-title">② 请求与瞬态恢复 · 每轮一次</text>
  <text x="110" y="472" class="box-text">rounds_since_todo ≥ 3 → reminder (L274)</text>
  <text x="110" y="492" class="box-text">refresh_system_prompts (L284) → compactor.prepare (L285) → 过滤 compact (L286)</text>
  <rect x="104" y="500" width="592" height="24" rx="6" class="decision"/>
  <text x="110" y="517" class="box-text">with_retry (L290) → completion_request → chat.completions.create (L291)</text>
  <rect x="104" y="530" width="592" height="44" rx="6" class="recovery"/>
  <text x="110" y="547" class="box-text">429 / 529：退避 0.5→32s + jitter，Retry-After 优先，529×3 → fallback</text>
  <text x="110" y="567" class="box-text">prompt too long：reactive_compact (L312) 每 turn 一次；否则收口 (L321)</text>

  <rect x="90" y="614" width="620" height="136" rx="10" class="stage"/>
  <text x="110" y="640" class="box-title">③ 响应分类 · 完整性先于写入 (L330)</text>
  <rect x="104" y="650" width="592" height="68" rx="6" class="recovery"/>
  <text x="110" y="667" class="box-text">首次截断：max_tokens 8K → 64K，丢弃片段，用原历史重放 (L331-L339)</text>
  <text x="110" y="687" class="box-text">已升级仍截断：存纯文本片段 + continuation，最多 3 条 (L341-L369)</text>
  <text x="110" y="707" class="box-text">3 条用尽 → 返回最后片段；片段为空 → 显式错误 (L348-L361)</text>
  <text x="110" y="738" class="box-text">完整 → assistant_payload 双写历史与快照 (L377)；半个 create_task 不会分发</text>

  <rect x="290" y="774" width="220" height="38" rx="10" class="decision"/>
  <text x="400" y="798" text-anchor="middle" class="box-text">assistant.tool_calls ?</text>

  <rect x="90" y="836" width="620" height="152" rx="10" class="stage"/>
  <text x="110" y="862" class="box-title">④ 工具批次 (L400)</text>
  <text x="110" y="886" class="box-text">compact → CompactToolController.request (L204)：唯一的控制工具例外</text>
  <text x="110" y="906" class="box-text">其他工具 → _execute_parent_tool → ToolExecutor.execute (L211 / L184)</text>
  <rect x="104" y="914" width="592" height="44" rx="6" class="task"/>
  <text x="110" y="931" class="box-text">任务 handler (L395)：create_task · list_tasks · get_task · claim · complete</text>
  <text x="110" y="951" class="box-text">返回字符串 observation，没有改写 messages 的特权；失败也是 Error: 文本</text>
  <text x="110" y="978" class="box-text">每个 tool_call 配对 role=tool (L218-L224)，整批写完才 compact_history (L407)</text>

  <rect x="90" y="1016" width="620" height="112" rx="10" class="stage"/>
  <text x="110" y="1042" class="box-title">⑤ turn 结束 · 仅最终回答</text>
  <text x="110" y="1066" class="box-text">Stop Hook (L386)：要求继续则追加 user 消息并回到 ②</text>
  <text x="110" y="1086" class="box-text">memory.extract_memories(快照) (L394) → consolidate_memories (L395)</text>
  <text x="110" y="1106" class="box-text">return answer (L396)；任务状态在工具执行那一刻已落盘，与出口无关</text>

  <line x1="400" y1="260" x2="400" y2="282" class="edge"/>
  <line x1="400" y1="394" x2="400" y2="420" class="edge"/>
  <line x1="400" y1="586" x2="400" y2="612" class="edge"/>
  <line x1="400" y1="750" x2="400" y2="772" class="edge"/>
  <line x1="400" y1="812" x2="400" y2="834" class="edge"/>
  <text x="408" y="830" class="edge-label">有</text>

  <path d="M510 793 L736 793 L736 1072 L713 1072" class="edge"/>
  <text x="516" y="786" class="edge-label">无 tool_calls</text>

  <path d="M90 684 L62 684" class="edge-plain"/>
  <path d="M90 906 L62 906 L62 440 L86 440" class="edge"/>
  <text x="6" y="560" class="edge-label">回到 ②</text>

  <rect x="800" y="126" width="450" height="190" rx="10" class="task"/>
  <text x="820" y="152" class="box-title">task_system.py · 持久任务板（s12 新增）</text>
  <text x="820" y="176" class="box-text">TASK_TOOLS L49：五个 schema 由模块内 _task_tool L24 构造</text>
  <text x="820" y="196" class="box-text">SAFE_TASK_ID L21：ID 直接参与文件名，先校验再拼路径</text>
  <text x="820" y="216" class="box-text">TaskRecord L107 · from_dict L128：磁盘 schema 七项校验</text>
  <text x="820" y="236" class="box-text">_load L200：文件名 stem 必须等于 JSON id (L211-L214)</text>
  <text x="820" y="256" class="box-text">blocking_dependencies L249 · can_start L263：依赖唯一实现</text>
  <text x="820" y="276" class="box-text">claim_task L344 · complete_task L368：严格状态机</text>
  <text x="820" y="296" class="box-text">handlers() L395：TaskError / OSError → Error: observation</text>

  <rect x="800" y="340" width="450" height="130" rx="10" class="task"/>
  <text x="820" y="366" class="box-title">严格状态机与 claim 门</text>
  <rect x="812" y="380" width="124" height="48" rx="8" class="decision"/>
  <text x="874" y="400" text-anchor="middle" class="box-text">pending</text>
  <text x="874" y="418" text-anchor="middle" class="edge-label">blockers 已完成</text>
  <rect x="968" y="380" width="124" height="48" rx="8" class="decision"/>
  <text x="1030" y="400" text-anchor="middle" class="box-text">in_progress</text>
  <text x="1030" y="418" text-anchor="middle" class="edge-label">owner 必须非空</text>
  <rect x="1120" y="380" width="118" height="48" rx="8" class="decision"/>
  <text x="1179" y="400" text-anchor="middle" class="box-text">completed</text>
  <text x="1179" y="418" text-anchor="middle" class="edge-label">终态，报告下游</text>
  <line x1="936" y1="404" x2="964" y2="404" class="edge"/>
  <line x1="1092" y1="404" x2="1116" y2="404" class="edge"/>
  <text x="950" y="374" text-anchor="middle" class="edge-label">claim</text>
  <text x="1106" y="374" text-anchor="middle" class="edge-label">complete</text>
  <text x="820" y="452" class="box-text">拒绝：blocked→claim · pending→complete · 重复 claim · 空 owner</text>

  <rect x="800" y="494" width="450" height="150" rx="10" class="task"/>
  <text x="820" y="520" class="box-title">依赖图 · 由 blockedBy 反向推导 (L249-L261)</text>
  <rect x="816" y="534" width="130" height="36" rx="8" class="decision"/>
  <text x="881" y="557" text-anchor="middle" class="box-text">task_001 done</text>
  <rect x="978" y="534" width="120" height="36" rx="8" class="decision"/>
  <text x="1038" y="557" text-anchor="middle" class="box-text">task_002 ready</text>
  <rect x="1130" y="534" width="104" height="36" rx="8" class="decision"/>
  <text x="1182" y="557" text-anchor="middle" class="box-text">task_004 blocked</text>
  <rect x="978" y="586" width="120" height="36" rx="8" class="decision"/>
  <text x="1038" y="609" text-anchor="middle" class="box-text">task_003 ready</text>
  <path d="M946 552 L974 552" class="dependency"/>
  <path d="M1098 552 L1126 552" class="dependency"/>
  <path d="M946 562 L962 562 L962 604 L974 604" class="dependency"/>
  <text x="820" y="636" class="box-text">只有 completed 解锁下游；缺失的依赖同样一直算 blocker</text>

  <rect x="800" y="668" width="450" height="110" rx="10" class="task"/>
  <text x="820" y="694" class="box-title">原子持久化 · _save L217-L241</text>
  <text x="820" y="718" class="box-text">完整 JSON → 同目录 mkstemp 临时文件 → flush → os.fsync</text>
  <text x="820" y="738" class="box-text">os.replace → chmod 600 → finally unlink，目录本身 mode 700</text>
  <text x="820" y="758" class="box-text">只保证单文件不半写；claim 的读改写没有跨进程锁</text>

  <rect x="800" y="802" width="450" height="110" rx="10" class="recovery"/>
  <text x="820" y="828" class="box-title">error_recovery.py · 恢复策略（s11）</text>
  <text x="820" y="852" class="box-text">RecoveryState L31 · with_retry L126：仅 429 / 529，最多 10 次</text>
  <text x="820" y="872" class="box-text">retry_delay L113：min(0.5·2^n, 32) + 0–25% jitter</text>
  <text x="820" y="892" class="box-text">is_output_truncated L92 · is_prompt_too_long_error L75</text>

  <rect x="800" y="936" width="450" height="110" rx="10" class="stage"/>
  <text x="820" y="962" class="box-title">tool_use.py / hooks.py / permission.py</text>
  <text x="820" y="986" class="box-text">PARENT_TOOLS L137-L144：TASK_TOOLS 插在 compact 之前 → 14</text>
  <text x="820" y="1006" class="box-text">SUB_TOOLS L145：6 个；伪造任务调用 → unknown tool L177</text>
  <text x="820" y="1026" class="box-text">execute L155：JSON → PreToolUse → handler → PostToolUse</text>

  <rect x="800" y="1070" width="450" height="90" rx="10" class="prompt"/>
  <text x="820" y="1096" class="box-title">system_prompt.py · Prompt 组装（s10）</text>
  <text x="820" y="1120" class="box-text">tools section 直接读注册表 L28-L31：父 14 子 6 自动同步</text>
  <text x="820" y="1140" class="box-text">父 guidance L10-L17：todo_write 与持久任务工具的分工</text>

  <rect x="800" y="1184" width="450" height="90" rx="10" class="compact"/>
  <text x="820" y="1210" class="box-title">context_compact.py · Compact（s08）</text>
  <text x="820" y="1234" class="box-text">prepare L315 · reactive_compact L288 · compact_history L274</text>
  <text x="820" y="1254" class="box-text">可以吞掉任务 observation 文本，改不了 .tasks/ 里的记录</text>

  <rect x="800" y="1298" width="450" height="90" rx="10" class="memory"/>
  <text x="820" y="1324" class="box-title">memory.py · Memory（s09）</text>
  <text x="820" y="1348" class="box-text">load L303 → inject L332 · extract L425 → consolidate L476</text>
  <text x="820" y="1368" class="box-text">提取输入是独立快照；长期事实分两处：记忆与任务板</text>

  <path d="M710 222 L796 200" class="link"/>
  <path d="M710 560 L796 850" class="link"/>
  <path d="M710 690 L796 880" class="link"/>
  <path d="M710 930 L796 990" class="link"/>
  <path d="M710 978 L796 1230" class="link"/>
  <path d="M710 1086 L796 1344" class="link"/>

  <text x="32" y="1418" class="subtitle">TodoWrite 是内存里的执行清单，Task System 是磁盘上的项目任务板；SubAgent 在 schema 表与 handler 表里都拿不到任务工具。</text>
</svg>
