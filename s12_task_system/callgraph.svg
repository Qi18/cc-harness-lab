  <text x="648" y="1024" text-anchor="middle" fill="#6b7280" font-size="10">≥10 条合并到 ≤8</text>

  <rect x="788" y="990" width="200" height="44" rx="8" fill="#fde8e8" stroke="#dc2626"/>
  <text x="888" y="1008" text-anchor="middle" fill="#1f2328" font-size="11">_record_error L243</text>
