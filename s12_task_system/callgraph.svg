  <text x="26" y="976" fill="#7c3aed" font-size="12">③ turn 结束 · 仅无 tool_calls 且 Stop Hook 放行（L342-352）</text>

  <rect x="28" y="990" width="220" height="44" rx="8" fill="#f6f6f7" stroke="#d0d0d5"/>
