  <rect x="268" y="990" width="240" height="44" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
  <text x="388" y="1008" text-anchor="middle" fill="#1f2328" font-size="11">extract_memories L350</text>
  <text x="388" y="1024" text-anchor="middle" fill="#6b7280" font-size="10">输入是快照</text>

  <rect x="528" y="990" width="240" height="44" rx="8" fill="#efe6fd" stroke="#7c3aed"/>
